name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for this release (e.g. v0.1.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validate release SHA, CI and notes
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reject tracked local drafts and runtime files
        run: python scripts/check_release_scope.py
      - name: Offline release gate tests
        run: python -m unittest discover -s scripts -p 'test_release*.py'
      - name: Validate release
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release_gate.py check --tag "$RELEASE_TAG"

  build:
    name: Build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout validated SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux cross-compilers
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
              ;;
            armv7-unknown-linux-gnueabihf)
              sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
              echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
              ;;
            riscv64gc-unknown-linux-gnu)
              sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu
              echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc" >> $GITHUB_ENV
              ;;
            i686-unknown-linux-gnu)
              sudo apt-get update && sudo apt-get install -y gcc-i686-linux-gnu
              echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=i686-linux-gnu-gcc" >> $GITHUB_ENV
              ;;
          esac

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # skarn-sandbox 1.0.1 infers libc::c_long as i32 on 32-bit Linux,
      # while seccompiler requires i64 syscall numbers. Remove this once the
      # upstream crate includes the same conversion.
      - name: Patch skarn-sandbox for 32-bit Linux
        if: >-
          runner.os == 'Linux' &&
          (matrix.target == 'armv7-unknown-linux-gnueabihf' ||
           matrix.target == 'i686-unknown-linux-gnu')
        shell: bash
        run: |
          cargo fetch --locked --target "${{ matrix.target }}"
          skarn_linux="$(find "$CARGO_HOME/registry/src" -path '*/skarn-sandbox-1.0.1/src/linux.rs' -print -quit)"
          test -n "$skarn_linux"
          grep -Fq 'rules.insert(sysno, Vec::new());' "$skarn_linux"
          sed -i 's/rules\.insert(sysno, Vec::new());/rules.insert(i64::from(sysno), Vec::new());/' "$skarn_linux"
          grep -Fq 'rules.insert(i64::from(sysno), Vec::new());' "$skarn_linux"

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../programmer-${{ matrix.target }}.tar.gz programmer
          cd ../../..

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target\${{ matrix.target }}\release
          7z a ..\..\..\programmer-${{ matrix.target }}.zip programmer.exe
          cd ..\..\..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: programmer-${{ matrix.target }}
          path: |
            programmer-${{ matrix.target }}.tar.gz
            programmer-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: Validate draft and publish
    runs-on: ubuntu-latest
    needs: [gate, build]
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}

    steps:
      - name: Checkout validated SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: programmer-*
          merge-multiple: true
          path: dist
      - name: Recheck CI, tag, notes and local archives
        run: python scripts/release_gate.py prepare --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
      - name: Create draft and upload archives
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ needs.gate.outputs.sha }}
          body_path: release-body.md
          generate_release_notes: false
          draft: true
          fail_on_unmatched_files: true
          files: dist/*
      - name: Verify uploaded assets and publish
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: python scripts/release_gate.py publish --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --release-id "$RELEASE_ID"
