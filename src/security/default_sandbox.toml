network = false
allow_system_read = true
allow_temp_write = true
fail_closed = true

readable_paths = [
    "~/.cargo/bin",
    "~/.cargo/git",
    "~/.cargo/registry",
    "~/.rustup",
    "~/.local/share",
    "/opt/homebrew",
    "/nix/store",
]

writable_paths = []

denied_read_paths = [
    "~/.ssh",
    "~/.aws",
    "~/.gnupg",
    "~/.kube",
    "~/.docker",
    "~/.netrc",
    "~/.npmrc",
    "~/.pypirc",
    "~/.config/gcloud",
    "~/.config/gh",
    "~/.cargo/credentials",
    "~/.cargo/credentials.toml",
    "~/.bash_history",
    "~/.claude",
    "~/.codex",
    "~/.config/opencode",
    "~/.fish_history",
    "~/.local/share/fish/fish_history",
    "~/.zsh_history",
    "~/Library/Application Support/1Password",
    "~/Library/Application Support/Arc/User Data",
    "~/Library/Application Support/Bitwarden",
    "~/Library/Application Support/BraveSoftware",
    "~/Library/Application Support/Firefox",
    "~/Library/Application Support/Google/Chrome",
    "~/Library/Application Support/Microsoft Edge",
    "~/Library/Application Support/com.apple.TCC",
    "~/Library/Application Support/programmer",
    "~/Library/Cookies",
    "~/Library/Keychains",
    "~/Library/Mail",
    "~/Library/Messages",
    "~/Library/Safari",
]

inherit_environment = [
    "ANDROID_HOME",
    "ANDROID_SDK_ROOT",
    "AR",
    "CC",
    "CARGO_HOME",
    "CLICOLOR",
    "CLICOLOR_FORCE",
    "CMAKE_PREFIX_PATH",
    "COLORTERM",
    "CPATH",
    "CXX",
    "DEVELOPER_DIR",
    "GOPATH",
    "GOROOT",
    "HOME",
    "JAVA_HOME",
    "LANG",
    "LANGUAGE",
    "LC_*",
    "LD",
    "LIBRARY_PATH",
    "LOGNAME",
    "MACOSX_DEPLOYMENT_TARGET",
    "NO_COLOR",
    "PATH",
    "PKG_CONFIG_PATH",
    "RUST_BACKTRACE",
    "RUST_LOG",
    "RUSTUP_HOME",
    "SDKROOT",
    "SHELL",
    "TEMP",
    "TERM",
    "TERMINFO",
    "TERMINFO_DIRS",
    "TERM_PROGRAM",
    "TERM_PROGRAM_VERSION",
    "TMP",
    "TMPDIR",
    "TZ",
    "USER",
]
